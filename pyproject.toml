[project]
name = "dte-backoffice-agent"
version = "0.1.0"
description = "Agente LangGraph que procesa facturas electrónicas chilenas (DTE del SII): valida, categoriza contablemente y registra, con aprobación humana cuando corresponde."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cristian Rodriguez" }]
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.scripts]
dte-agent = "dte_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "langgraph-cli[inmem]>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dte_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
